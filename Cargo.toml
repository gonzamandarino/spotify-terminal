[package]
name = "spotify-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cliente de Spotify liviano para la terminal"
publish = false

# Las crates se agregan en la tarea que las empieza a usar (ver spec 001).
[dependencies]
# Ya la trae librespot (salida de audio); se usa para ver si hay dispositivo.
cpal = "0.16.0"
# event-stream: teclas como Stream async, sin hilo lector propio.
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
dotenvy = "0.15.7"
# Ya la trae librespot; solo por `StreamExt::next` sobre las teclas.
futures-util = { version = "0.3.34", default-features = false }
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
librespot-playback = "0.8.0"
# Misma versión que ya trae librespot-oauth: un solo stack HTTP/TLS.
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }

# Binario chico y con menos memoria: optimiza por tamaño y enlaza todo junto.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
# Solo para el test que fija el texto de error de oauth2 (auth.rs).
oauth2 = { version = "5.0.0", default-features = false }
