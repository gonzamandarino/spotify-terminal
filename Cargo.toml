[package]
name = "spotify-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cliente de Spotify liviano para la terminal"
publish = false

# Las crates se agregan en la tarea que las empieza a usar (ver spec 001).
[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
dotenvy = "0.15.7"
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
librespot-playback = "0.8.0"
# Misma versión que ya trae librespot-oauth: un solo stack HTTP/TLS.
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }

# Binario chico y con menos memoria: optimiza por tamaño y enlaza todo junto.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
env_logger = "0.11.11"
