[package]
name = "spotify-terminal"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Cliente de Spotify liviano para la terminal"
publish = false

# Las crates se agregan en la tarea que las empieza a usar (ver spec 001).
[dependencies]
# Ya la trae librespot (salida de audio); se usa para ver si hay dispositivo.
cpal = "0.16.0"
# event-stream: teclas como Stream async, sin hilo lector propio.
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
# App de escritorio (spec 004): egui dibujado por CPU (sin driver de GPU:
# con OpenGL la ventana sola ocupaba ~120 MB). Ventana con winit, imagen con
# softbuffer (GDI). Ver docs/decisiones.md.
bytemuck = "1.25"
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard"] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }
softbuffer = { version = "0.4.8", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
dotenvy = "0.15.7"
# Ya la trae librespot; solo por `StreamExt::next` sobre las teclas.
futures-util = { version = "0.3.34", default-features = false }
# Ya la trae el portapapeles de egui-winit (BMP/PNG); se le suma JPEG para
# las tapas de la visualización (spec 010, ver docs/decisiones.md).
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
librespot-playback = "0.8.0"
# Misma versión y features que ya compila librespot: shuffle de la cola.
rand = "0.9.5"
# Misma versión que ya trae librespot-oauth: un solo stack HTTP/TLS.
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }

# Binario chico y con menos memoria: optimiza por tamaño y enlaza todo junto.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Cuadro de error nativo y atajos globales (RegisterHotKey) de la app de
# escritorio. Misma versión que winit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Ícono del .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
# Solo para el test que fija el texto de error de oauth2 (auth.rs).
oauth2 = { version = "5.0.0", default-features = false }

# CLI (el de siempre) y app de escritorio (spec 004).
[[bin]]
name = "spotify-terminal"
path = "src/main.rs"

[[bin]]
name = "spotify-desktop"
path = "src/bin/desktop.rs"
